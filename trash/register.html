<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="./login.css">
</head>

<body>
	<div class="card-container">

		<div class="card-content p-4">
			<div class="d-flex justify-content-center">
				<img class="w-50" src="./newLogo.png" alt="">
			</div>
			<h1 class="text-center">Create Your Account</h1>
			<p class="text-center">Join TalentBank and bulid your professional futute</p>
			<form action="">

				<div class="mb-3">
					<label for="name" class="form-label">Full Name</label>
					<div class="input-group">
						<span class="input-group-text bg-white" id="basic-addon1">
							<i class="fa-solid fa-user"></i>
						</span>
						<input type="text" id="name" class="form-control" aria-label="Full Name"
							aria-describedby="basic-addon1">
					</div>
				</div>

				<div class="mb-3">
					<label for="email" class="form-label">Email Address</label>
					<div class="input-group">
						<span class="input-group-text bg-white" id="basic-addon1">
							<i class="fa-regular fa-envelope"></i>
						</span>
						<input type="email" id="email" class="form-control" aria-label="Email"
							aria-describedby="basic-addon1">
					</div>
				</div>

				<div class="mb-3">
					<label for="password" class="form-label">Password</label>
					<div class="input-group">
						<span class="input-group-text bg-white" id="basic-addon1">
							<i class="fa-regular fas fa-lock"></i>
						</span>
						<input type="password" id="password" class="form-control" aria-label="Email"
							aria-describedby="basic-addon1">
					</div>
				</div>

				<div class="d-flex justify-content-between my-2">
					<div></div>
					<a href="" class="text-primary fw-bold text-decoration-none">Forgot password?</a>
				</div>

				<button type="submit" class="btn btn-primary w-100">Create Account</button>

			</form>

			<div class="d-flex mt-4 justify-content-center">
				<p>Already have an account? - </p>
				<a href="./login.html" class="text-primary fw-bold text-decoration-none">Sign in</a>
			</div>
		</div>
	</div>
</body>

</html>
