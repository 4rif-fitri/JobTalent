<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentBank</title>
<link rel="shortcut icon" href="" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../libs/bootstrap.min.css">
<script>
	if (window.innerWidth > 768 && localStorage.getItem("sidebarCollapsed") === "true") {
		document.documentElement.classList.add("sidebar-collapsed-init");
	}
</script>
<link rel="stylesheet" href="../style/layout.css">
<link rel="stylesheet" href="../style/style.css">


<body>

	<!-- SIDEBAR -->
	<aside class="sidebar">

		<!-- LOGO -->
		<div class="sidebar-logo">
			<i class="fa-solid fa-graduation-cap"></i>
			<span>TalentBank</span>
		</div>

		<!-- MENU -->
		<nav class="sidebar-menu">

			<!-- Dashboard -->
			<div class="sidebar-item">
				<a href="profile.html" class="sidebar-link">
					<i class="fa-solid fa-gauge-high menu-icon"></i>
					<span class="menu-text">
						Index
					</span>
				</a>
			</div>

			<!-- SUBMENU -->
			<div class="sidebar-item has-submenu">
				<a href="#" class="sidebar-link submenu-toggle">
					<i class="fa-regular fa-user menu-icon"></i>
					<span class="menu-text">My Profile</span>
					<i class="fa-solid fa-chevron-right submenu-arrow"></i>
				</a>

				<ul class="submenu">
					<li>
						<a href="profile.html" class="submenu-link">
							View Profile
						</a>
					</li>
					<li>
						<a href="edit-profile.html" class="submenu-link">
							Edit Profile
						</a>
					</li>
					<li>
						<a href="employment-status.html" class="submenu-link">Employment Status
						</a>
					</li>
				</ul>
			</div>

			<div class="sidebar-item">
				<a href="resume.html" class="sidebar-link">
					<i class="fa-regular fa-file menu-icon"></i>
					<span class="menu-text">Resume</span>
				</a>
			</div>


			<div class="sidebar-item">
				<a href="random.html" class="sidebar-link">
					<i class="fa-regular fa-file menu-icon"></i>
					<span class="menu-text">Random</span>
				</a>
			</div>
		</nav>

	</aside>

	<div class="sidebar-overlay"></div>

	<header class="topbar">

		<div class="topbar-left">
			<button type="button" class="menu-toggle" id="menuToggle">
				<i class="fa-solid fa-bars"></i>
			</button>
		</div>

		<div class="topbar-right">

			<button type="button" class="profile-btn" id="profileBtn">
				<i class="fa-solid fa-ellipsis"></i>
			</button>

			<div class="profile-dropdown" id="profileDropdown">
				<a href="profile.html">
					<i class="fa-solid fa-circle-user"></i>
					Profile
				</a>

				<a href="logout.html" class="logout">
					<i class="fa-solid fa-right-from-bracket"></i>
					Logout
				</a>
			</div>

		</div>
	</header>

	<main class="main-content">
		<div class="content">
			<div class="card">
				<div class="d-flex justify-content-between">
					<div class="d-flex gap-4">
						<a href="profile.html" class="h3">
							<i class="fa-solid fa-arrow-left"></i>
						</a>
						<h3 class="fw-bold">Languages</h3>
					</div>
					<div>
						<button type="button" class="btn bg-primary icon" data-bs-toggle="modal"
							data-bs-target="#addSkillModal">
							<i class="fa-solid fas fa-plus text-white"></i>
						</button>
					</div>
				</div>

				<hr>

				<article class="m-1 position-relative">
					<div class="icon-container" style="top: 0; right: 0;">
						<button type="button" class="btn btn-secondary icon" data-bs-toggle="modal"
							data-bs-target="#updateSkillModal">
							<i class="fa-solid fa-pencil"></i>
						</button>
					</div>

					<p class="fw-bold">Database</p>
					<p>Advanced</p>
				</article>

				<hr>

				<article class="m-1 position-relative">
					<div class="icon-container" style="top: 0; right: 0;">
						<button type="button" class="btn btn-secondary icon" data-bs-toggle="modal"
							data-bs-target="#updateSkillModal">
							<i class="fa-solid fa-pencil"></i>
						</button>
					</div>

					<p class="fw-bold">Database</p>
					<p>Advanced</p>
				</article>

			</div>
		</div>

		<div class="modal fade" id="addSkillModal" data-bs-backdrop="static" aria-hidden="true">
			<div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
				<div class="modal-content">
					<form id="addSkillForm" action="#" method="POST">
						<div class="modal-header">
							<h1 class="h3 modal-title fs-5">Add Skill</h1>
							<button type="reset" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>

						<div class="modal-body">
							<div class="input-group mb-3">
								<select class="form-select" id="skillSelect" name="skill" required>
									<option selected disabled value="">Select Skill</option>
									<option value="PHP">PHP</option>
									<option value="Laravel">Laravel</option>
									<option value="JavaScript">JavaScript</option>
									<option value="Vue">Vue.js</option>
									<option value="React">React</option>
									<option value="MySQL">MySQL</option>
									<option value="HTML_CSS">HTML & CSS</option>
								</select>
							</div>
							<div class="input-group mb-3">
								<select class="form-select" id="proficiencySelect" name="proficiency" required>
									<option selected disabled value="">Select Proficiency</option>
									<option value="Beginner">Beginner</option>
									<option value="Intermediate">Intermediate</option>
									<option value="Advanced">Advanced</option>
									<option value="Expert">Expert</option>
								</select>
							</div>
						</div>

						<div class="modal-footer">
							<button type="submit" class="btn btn-primary" id="btnSaveSkill">Save</button>
						</div>
					</form>
				</div>
			</div>
		</div>

		<div class="modal fade" id="updateSkillModal" data-bs-backdrop="static" aria-hidden="true">
			<div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
				<div class="modal-content">

					<form id="updateSkillForm" action="#" method="POST">

						<div class="modal-header">
							<h1 class="h3 modal-title fs-5">Add Skill</h1>
							<button type="reset" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>

						<div class="modal-body">
							<div class="input-group mb-3">
								<select class="form-select" id="skillSelect" name="skill" required>
									<option selected disabled value="">Select Skill</option>
									<option value="PHP">PHP</option>
									<option value="Laravel">Laravel</option>
									<option value="JavaScript">JavaScript</option>
									<option value="Vue">Vue.js</option>
									<option value="React">React</option>
									<option value="MySQL">MySQL</option>
									<option value="HTML_CSS">HTML & CSS</option>
								</select>
							</div>
							<div class="input-group mb-3">
								<select class="form-select" id="proficiencySelect" name="proficiency" required>
									<option selected disabled value="">Select Proficiency</option>
									<option value="Beginner">Beginner</option>
									<option value="Intermediate">Intermediate</option>
									<option value="Advanced">Advanced</option>
									<option value="Expert">Expert</option>
								</select>
							</div>
						</div>

						<div class="modal-footer d-flex justify-content-between">
							<button type="button" class="btn btn-danger">Delete</button>
							<button type="submit" class="btn btn-primary" id="btnSaveSkill">Save</button>
						</div>

					</form>

				</div>
			</div>
		</div>
	</main>

	<script src="../libs/jquery-4.0.0.min.js"></script>
	<link rel="stylesheet" href="../libs/jquery-ui.css">
	<script src="../libs/jquery-ui.min.js"></script>
	<script src="../libs/bootstrap.min.js"></script>
	<script src="../libs/sweetalert2@11.js"></script>
	<script src="../js/layout.js"></script>

	<script>

	</script>
</body>

</html>
