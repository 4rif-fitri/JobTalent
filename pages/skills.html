<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentBank</title>
<link rel="shortcut icon" href="" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../libs/bootstrap.min.css">
<script>
	if (window.innerWidth > 768 && localStorage.getItem("sidebarCollapsed") === "true") {
		document.documentElement.classList.add("sidebar-collapsed-init");
	}
</script>
<link rel="stylesheet" href="../style/layout.css">
<link rel="stylesheet" href="../style/style.css">


<body>

	<!-- SIDEBAR -->
	<aside class="sidebar">

		<!-- LOGO -->
		<div class="sidebar-logo">
			<i class="fa-solid fa-graduation-cap"></i>
			<span>TalentBank</span>
		</div>

		<!-- MENU -->
		<nav class="sidebar-menu">

			<!-- Dashboard -->
			<div class="sidebar-item">
				<a href="profile.html" class="sidebar-link">
					<i class="fa-solid fa-gauge-high menu-icon"></i>
					<span class="menu-text">
						Index
					</span>
				</a>
			</div>

			<!-- SUBMENU -->
			<div class="sidebar-item has-submenu">
				<a href="#" class="sidebar-link submenu-toggle">
					<i class="fa-regular fa-user menu-icon"></i>
					<span class="menu-text">My Profile</span>
					<i class="fa-solid fa-chevron-right submenu-arrow"></i>
				</a>

				<ul class="submenu">
					<li>
						<a href="profile.html" class="submenu-link">
							View Profile
						</a>
					</li>
					<li>
						<a href="edit-profile.html" class="submenu-link">
							Edit Profile
						</a>
					</li>
					<li>
						<a href="employment-status.html" class="submenu-link">Employment Status
						</a>
					</li>
				</ul>
			</div>

			<div class="sidebar-item">
				<a href="resume.html" class="sidebar-link">
					<i class="fa-regular fa-file menu-icon"></i>
					<span class="menu-text">Resume</span>
				</a>
			</div>


			<div class="sidebar-item">
				<a href="random.html" class="sidebar-link">
					<i class="fa-regular fa-file menu-icon"></i>
					<span class="menu-text">Random</span>
				</a>
			</div>
		</nav>

	</aside>

	<div class="sidebar-overlay"></div>

	<header class="topbar">

		<div class="topbar-left">
			<button type="button" class="menu-toggle" id="menuToggle">
				<i class="fa-solid fa-bars"></i>
			</button>
		</div>

		<div class="topbar-right">

			<button type="button" class="profile-btn" id="profileBtn">
				<i class="fa-solid fa-ellipsis"></i>
			</button>

			<div class="profile-dropdown" id="profileDropdown">
				<a href="profile.html">
					<i class="fa-solid fa-circle-user"></i>
					Profile
				</a>

				<a href="logout.html" class="logout">
					<i class="fa-solid fa-right-from-bracket"></i>
					Logout
				</a>
			</div>

		</div>
	</header>

	<main class="main-content">
		<div class="content">
			<div class="card">
				<div class="d-flex justify-content-between">
					<div class="d-flex gap-4">
						<a href="profile.html" class="h3">
							<i class="fa-solid fa-arrow-left"></i>
						</a>
						<h3 class="fw-bold">Skills</h3>
					</div>
					<div>
						<button type="button" class="btn bg-primary icon" onclick="openAddSkill()">
							<i class="fa-solid fas fa-plus text-white"></i>
						</button>
					</div>
				</div>

				<hr>

				<article class="m-1 position-relative">

					<div class="icon-container" style="top: 0; right: 0;">
						<button type="button" class="btn btn-secondary icon" onclick="editSkill(15)">
							<i class="fa-solid fa-pencil"></i>
						</button>
					</div>

					<div class="d-flex align-items-center gap-3">

						<div>
							<p class="fw-bold mb-1">
								Database
							</p>

							<p class="mb-0">
								Advanced
							</p>
						</div>

					</div>

				</article>

			</div>
		</div>
		<div class="modal fade" id="skillModal" data-bs-backdrop="static" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">

				<div class="modal-content">

					<div class="modal-header">

						<h5 class="modal-title">
							Add Skill
						</h5>

						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>

					</div>

					<div class="modal-body">

						<div class="mb-3">

							<label for="skillSelect" class="form-label">
								Skill
							</label>

							<select id="skillSelect" class="form-select" required>
								<option value="" selected disabled>
									Select Skill
								</option>

								<option value="1">
									Database
								</option>

								<option value="2">
									PHP
								</option>

								<option value="3">
									Laravel
								</option>

								<option value="4">
									JavaScript
								</option>

								<option value="5">
									React
								</option>

								<option value="6">
									Vue.js
								</option>

								<option value="7">
									MySQL
								</option>

								<option value="8">
									Web Development
								</option>

							</select>

						</div>


						<div class="mb-3">

							<label for="skillLevel" class="form-label">
								Level
							</label>

							<select id="skillLevel" class="form-select" required>
								<option value="" selected disabled>
									Select Level
								</option>

								<option value="Beginner">
									Beginner
								</option>

								<option value="Intermediate">
									Intermediate
								</option>

								<option value="Advanced">
									Advanced
								</option>

								<option value="Expert">
									Expert
								</option>

							</select>

						</div>

					</div>


					<div class="modal-footer justify-content-between">

						<button type="button" id="btnDeleteSkill"
							class="btn btn-link text-danger text-decoration-none d-none">
							Delete
						</button>

						<button type="button" id="btnSaveSkill" class="btn btn-primary">
							Save
						</button>

					</div>

				</div>

			</div>
		</div>

	</main>

	<script src="../libs/jquery-4.0.0.min.js"></script>
	<link rel="stylesheet" href="../libs/jquery-ui.css">
	<script src="../libs/jquery-ui.min.js"></script>
	<script src="../libs/bootstrap.min.js"></script>
	<script src="../libs/sweetalert2@11.js"></script>
	<script src="../js/layout.js"></script>

	<script>
		/*
		|--------------------------------------------------------------------------
		| STATE
		|--------------------------------------------------------------------------
		*/

		let skillMode = "add";
		let editingStudentSkillId = null;


		/*
		|--------------------------------------------------------------------------
		| ELEMENTS
		|--------------------------------------------------------------------------
		*/

		const skillModalEl =
			document.getElementById(
				"skillModal"
			);

		const skillModal =
			bootstrap.Modal.getOrCreateInstance(
				skillModalEl
			);

		const skillSelect =
			document.getElementById(
				"skillSelect"
			);

		const skillLevel =
			document.getElementById(
				"skillLevel"
			);

		const btnSaveSkill =
			document.getElementById(
				"btnSaveSkill"
			);

		const btnDeleteSkill =
			document.getElementById(
				"btnDeleteSkill"
			);


		/*
		|--------------------------------------------------------------------------
		| ADD
		|--------------------------------------------------------------------------
		*/

		function openAddSkill() {

			skillMode =
				"add";

			editingStudentSkillId =
				null;


			document.querySelector(
				"#skillModal .modal-title"
			).textContent =
				"Add Skill";


			btnSaveSkill.textContent =
				"Save";


			btnDeleteSkill
				.classList
				.add("d-none");


			skillSelect.value =
				"";

			skillLevel.value =
				"";


			skillModal.show();
		}


		/*
		|--------------------------------------------------------------------------
		| EDIT
		|--------------------------------------------------------------------------
		*/

		function editSkill(id) {

			skillMode =
				"edit";

			editingStudentSkillId =
				id;


			/*
			|--------------------------------------------------------------------------
			| DUMMY DATA
			| Nanti tukar kepada GET /student-skills/{id}
			|--------------------------------------------------------------------------
			*/

			const data = {

				id:
					id,

				skill_id:
					"1",

				level:
					"Advanced"

			};


			document.querySelector(
				"#skillModal .modal-title"
			).textContent =
				"Edit Skill";


			btnSaveSkill.textContent =
				"Update";


			btnDeleteSkill
				.classList
				.remove("d-none");


			skillSelect.value =
				data.skill_id;

			skillLevel.value =
				data.level;


			skillModal.show();
		}


		/*
		|--------------------------------------------------------------------------
		| SAVE / UPDATE
		|--------------------------------------------------------------------------
		*/

		btnSaveSkill.addEventListener(
			"click",
			function () {

				const skillId =
					skillSelect.value;

				const level =
					skillLevel.value;


				if (!skillId) {

					alert(
						"Please select a skill."
					);

					return;
				}


				if (!level) {

					alert(
						"Please select a level."
					);

					return;
				}


				const data = {

					skill_id:
						skillId,

					level:
						level

				};


				let url;
				let type;


				/*
				|--------------------------------------------------------------------------
				| ADD
				|--------------------------------------------------------------------------
				*/

				if (
					skillMode === "add"
				) {

					url =
						"/student-skills";

					type =
						"POST";

				}

				/*
				|--------------------------------------------------------------------------
				| UPDATE
				|--------------------------------------------------------------------------
				*/

				else {

					url =
						`/student-skills/${editingStudentSkillId}`;

					type =
						"PUT";

				}


				console.log(
					"MODE:",
					skillMode
				);

				console.log(
					"URL:",
					url
				);

				console.log(
					data
				);


				/*
				|--------------------------------------------------------------------------
				| AJAX
				|--------------------------------------------------------------------------
				*/

				$.ajax({

					url:
						url,

					type:
						type,

					data:
						data,

					success:
						function (response) {

							console.log(
								response
							);

							skillModal.hide();

						},

					error:
						function (xhr) {

							console.log(
								xhr.responseJSON
							);

						}

				});

			}
		);


		/*
		|--------------------------------------------------------------------------
		| DELETE
		|--------------------------------------------------------------------------
		*/

		btnDeleteSkill.addEventListener(
			"click",
			function () {

				if (
					skillMode !== "edit" ||
					!editingStudentSkillId
				) {
					return;
				}


				Swal.fire({

					title:
						"Delete skill?",

					text:
						"This skill will be removed from your profile.",

					icon:
						"warning",

					showCancelButton:
						true,

					confirmButtonText:
						"Delete",

					cancelButtonText:
						"Cancel"

				}).then(
					function (result) {

						if (!result.isConfirmed) {
							return;
						}


						$.ajax({

							url:
								`/student-skills/${editingStudentSkillId}`,

							type:
								"DELETE",

							success:
								function (response) {

									console.log(
										response
									);

									skillModal.hide();

								},

							error:
								function (xhr) {

									console.log(
										xhr.responseJSON
									);

								}

						});

					}
				);

			}
		);
	</script>
</body>

</html>
