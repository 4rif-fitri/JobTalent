<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentBank</title>
<link rel="shortcut icon" href="" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../libs/bootstrap.min.css">
<script>
	if (window.innerWidth > 768 && localStorage.getItem("sidebarCollapsed") === "true") {
		document.documentElement.classList.add("sidebar-collapsed-init");
	}
</script>
<link rel="stylesheet" href="../style/layout.css">
<link rel="stylesheet" href="../style/style.css">


<body>

	<!-- SIDEBAR -->
	<aside class="sidebar">

		<!-- LOGO -->
		<div class="sidebar-logo">
			<i class="fa-solid fa-graduation-cap"></i>
			<span>TalentBank</span>
		</div>

		<!-- MENU -->
		<nav class="sidebar-menu">

			<!-- Dashboard -->
			<div class="sidebar-item">
				<a href="profile.html" class="sidebar-link">
					<i class="fa-solid fa-gauge-high menu-icon"></i>
					<span class="menu-text">
						Index
					</span>
				</a>
			</div>

			<!-- SUBMENU -->
			<div class="sidebar-item has-submenu">
				<a href="#" class="sidebar-link submenu-toggle">
					<i class="fa-regular fa-user menu-icon"></i>
					<span class="menu-text">My Profile</span>
					<i class="fa-solid fa-chevron-right submenu-arrow"></i>
				</a>

				<ul class="submenu">
					<li>
						<a href="profile.html" class="submenu-link">
							View Profile
						</a>
					</li>
					<li>
						<a href="edit-profile.html" class="submenu-link">
							Edit Profile
						</a>
					</li>
					<li>
						<a href="employment-status.html" class="submenu-link">Employment Status
						</a>
					</li>
				</ul>
			</div>

			<div class="sidebar-item">
				<a href="resume.html" class="sidebar-link">
					<i class="fa-regular fa-file menu-icon"></i>
					<span class="menu-text">Resume</span>
				</a>
			</div>


			<div class="sidebar-item">
				<a href="random.html" class="sidebar-link">
					<i class="fa-regular fa-file menu-icon"></i>
					<span class="menu-text">Random</span>
				</a>
			</div>
		</nav>

	</aside>

	<div class="sidebar-overlay"></div>

	<header class="topbar">

		<div class="topbar-left">
			<button type="button" class="menu-toggle" id="menuToggle">
				<i class="fa-solid fa-bars"></i>
			</button>
		</div>

		<div class="topbar-right">

			<button type="button" class="profile-btn" id="profileBtn">
				<i class="fa-solid fa-ellipsis"></i>
			</button>

			<div class="profile-dropdown" id="profileDropdown">
				<a href="profile.html">
					<i class="fa-solid fa-circle-user"></i>
					Profile
				</a>

				<a href="logout.html" class="logout">
					<i class="fa-solid fa-right-from-bracket"></i>
					Logout
				</a>
			</div>

		</div>
	</header>

	<main class="main-content">
		<div class="content">
			<div class="card">
				<div class="d-flex justify-content-between">
					<div class="d-flex gap-4">
						<a href="profile.html" class="h3">
							<i class="fa-solid fa-arrow-left"></i>
						</a>
						<h3 class="fw-bold">Languages</h3>
					</div>
					<div>
						<button type="button" class="btn bg-primary icon" onclick="openAddLanguage()">
							<i class="fa-solid fas fa-plus text-white"></i>
						</button>
					</div>
				</div>

				<hr>

				<article class="m-1 position-relative">
					<div class="icon-container" style="top: 0; right: 0;">
						<button type="button" class="btn btn-secondary icon" onclick="editLanguage(15)">
							<i class="fa-solid fa-pencil"></i>
						</button>
					</div>

					<p class="fw-bold">Bahasa Melayu</p>
					<p>Native</p>
				</article>




			</div>
		</div>

		<div class="modal fade" id="languageModal" data-bs-backdrop="static" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">

				<div class="modal-content">

					<div class="modal-header">

						<h5 class="modal-title">
							Add Language
						</h5>

						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>

					</div>


					<div class="modal-body">

						<!-- LANGUAGE -->
						<div class="mb-3">

							<label for="languageSelect" class="form-label">
								Language
							</label>

							<select id="languageSelect" class="form-select" required>
								<option value="" selected disabled>
									Select Language
								</option>

								<option value="1">
									Bahasa Melayu
								</option>

								<option value="2">
									English
								</option>

								<option value="3">
									Mandarin
								</option>

								<option value="4">
									Tamil
								</option>

								<option value="5">
									Arabic
								</option>

								<option value="6">
									Japanese
								</option>

								<option value="7">
									Korean
								</option>
							</select>

						</div>


						<!-- PROFICIENCY -->
						<div class="mb-3">

							<label for="languageProficiency" class="form-label">
								Proficiency
							</label>

							<select id="languageProficiency" class="form-select" required>

								<option value="" selected disabled>
									Select Proficiency
								</option>

								<option value="elementary">
									Elementary proficiency
								</option>

								<option value="limited_working">
									Limited working proficiency
								</option>

								<option value="professional_working">
									Professional working proficiency
								</option>

								<option value="full_professional">
									Full professional proficiency
								</option>

								<option value="native">
									Native or bilingual proficiency
								</option>

							</select>

						</div>

					</div>


					<div class="modal-footer justify-content-between">

						<button type="button" id="btnDeleteLanguage"
							class="btn btn-link text-danger text-decoration-none d-none">
							Delete
						</button>

						<button type="button" id="btnSaveLanguage" class="btn btn-primary">
							Save
						</button>

					</div>

				</div>

			</div>
		</div>
	</main>

	<script src="../libs/jquery-4.0.0.min.js"></script>
	<link rel="stylesheet" href="../libs/jquery-ui.css">
	<script src="../libs/jquery-ui.min.js"></script>
	<script src="../libs/bootstrap.min.js"></script>
	<script src="../libs/sweetalert2@11.js"></script>
	<script src="../js/layout.js"></script>


	<script>
		/*
		|--------------------------------------------------------------------------
		| STATE
		|--------------------------------------------------------------------------
		*/

		let languageMode = "add";
		let editingStudentLanguageId = null;


		/*
		|--------------------------------------------------------------------------
		| ELEMENTS
		|--------------------------------------------------------------------------
		*/

		const languageModalEl =
			document.getElementById("languageModal");

		const languageModal =
			bootstrap.Modal.getOrCreateInstance(
				languageModalEl
			);

		const languageSelect =
			document.getElementById(
				"languageSelect"
			);

		const languageProficiency =
			document.getElementById(
				"languageProficiency"
			);

		const btnSaveLanguage =
			document.getElementById(
				"btnSaveLanguage"
			);

		const btnDeleteLanguage =
			document.getElementById(
				"btnDeleteLanguage"
			);


		/*
		|--------------------------------------------------------------------------
		| ADD LANGUAGE
		|--------------------------------------------------------------------------
		*/

		function openAddLanguage() {

			languageMode =
				"add";

			editingStudentLanguageId =
				null;


			document.querySelector(
				"#languageModal .modal-title"
			).textContent =
				"Add Language";


			btnSaveLanguage.textContent =
				"Save";


			btnDeleteLanguage.classList.add(
				"d-none"
			);


			languageSelect.value =
				"";

			languageProficiency.value =
				"";


			languageModal.show();
		}


		/*
		|--------------------------------------------------------------------------
		| EDIT LANGUAGE
		|--------------------------------------------------------------------------
		*/

		function editLanguage(id) {

			languageMode =
				"edit";

			editingStudentLanguageId =
				id;


			/*
			|--------------------------------------------------------------------------
			| DUMMY DATA
			| Nanti tukar kepada AJAX GET
			|--------------------------------------------------------------------------
			*/

			const data = {

				id:
					id,

				language_id:
					"2",

				proficiency_level:
					"professional_working"

			};


			document.querySelector(
				"#languageModal .modal-title"
			).textContent =
				"Edit Language";


			btnSaveLanguage.textContent =
				"Update";


			btnDeleteLanguage.classList.remove(
				"d-none"
			);


			languageSelect.value =
				data.language_id;

			languageProficiency.value =
				data.proficiency_level;


			languageModal.show();
		}


		/*
		|--------------------------------------------------------------------------
		| SAVE / UPDATE
		|--------------------------------------------------------------------------
		*/

		btnSaveLanguage.addEventListener(
			"click",
			function () {

				const languageId =
					languageSelect.value;

				const proficiency =
					languageProficiency.value;


				if (!languageId) {

					alert(
						"Please select a language."
					);

					return;
				}


				if (!proficiency) {

					alert(
						"Please select proficiency."
					);

					return;
				}


				const data = {

					language_id:
						languageId,

					proficiency_level:
						proficiency

				};


				let url;
				let type;


				/*
				|--------------------------------------------------------------------------
				| ADD
				|--------------------------------------------------------------------------
				*/

				if (
					languageMode === "add"
				) {

					url =
						"/student-languages";

					type =
						"POST";

				}

				/*
				|--------------------------------------------------------------------------
				| UPDATE
				|--------------------------------------------------------------------------
				*/

				else {

					url =
						`/student-languages/${editingStudentLanguageId}`;

					type =
						"PUT";

				}


				console.log(
					"MODE:",
					languageMode
				);

				console.log(
					"URL:",
					url
				);

				console.log(
					data
				);


				$.ajax({

					url:
						url,

					type:
						type,

					data:
						data,

					success:
						function (response) {

							console.log(
								response
							);

							languageModal.hide();

						},

					error:
						function (xhr) {

							console.log(
								xhr.responseJSON
							);

						}

				});

			}
		);


		/*
		|--------------------------------------------------------------------------
		| DELETE
		|--------------------------------------------------------------------------
		*/

		btnDeleteLanguage.addEventListener(
			"click",
			function () {

				if (
					languageMode !== "edit" ||
					!editingStudentLanguageId
				) {
					return;
				}


				Swal.fire({

					title:
						"Delete language?",

					text:
						"This language will be removed from your profile.",

					icon:
						"warning",

					showCancelButton:
						true,

					confirmButtonText:
						"Delete",

					cancelButtonText:
						"Cancel"

				}).then(
					function (result) {

						if (!result.isConfirmed) {
							return;
						}


						$.ajax({

							url:
								`/student-languages/${editingStudentLanguageId}`,

							type:
								"DELETE",

							success:
								function (response) {

									console.log(
										response
									);

									languageModal.hide();

								},

							error:
								function (xhr) {

									console.log(
										xhr.responseJSON
									);

								}

						});

					}
				);

			}
		);
	</script>
</body>

</html>
