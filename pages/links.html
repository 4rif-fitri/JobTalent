<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentBank</title>
<link rel="shortcut icon" href="" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../libs/bootstrap.min.css">
<script>
	if (window.innerWidth > 768 && localStorage.getItem("sidebarCollapsed") === "true") {
		document.documentElement.classList.add("sidebar-collapsed-init");
	}
</script>
<link rel="stylesheet" href="../style/layout.css">
<link rel="stylesheet" href="../style/style.css">


<body>

	<!-- SIDEBAR -->
	<aside class="sidebar">

		<!-- LOGO -->
		<div class="sidebar-logo">
			<i class="fa-solid fa-graduation-cap"></i>
			<span>TalentBank</span>
		</div>

		<!-- MENU -->
		<nav class="sidebar-menu">

			<!-- Dashboard -->
			<div class="sidebar-item">
				<a href="profile.html" class="sidebar-link">
					<i class="fa-solid fa-gauge-high menu-icon"></i>
					<span class="menu-text">
						Index
					</span>
				</a>
			</div>

			<!-- SUBMENU -->
			<div class="sidebar-item has-submenu">
				<a href="#" class="sidebar-link submenu-toggle">
					<i class="fa-regular fa-user menu-icon"></i>
					<span class="menu-text">My Profile</span>
					<i class="fa-solid fa-chevron-right submenu-arrow"></i>
				</a>

				<ul class="submenu">
					<li>
						<a href="profile.html" class="submenu-link">
							View Profile
						</a>
					</li>
					<li>
						<a href="edit-profile.html" class="submenu-link">
							Edit Profile
						</a>
					</li>
					<li>
						<a href="employment-status.html" class="submenu-link">Employment Status
						</a>
					</li>
				</ul>
			</div>

			<div class="sidebar-item">
				<a href="resume.html" class="sidebar-link">
					<i class="fa-regular fa-file menu-icon"></i>
					<span class="menu-text">Resume</span>
				</a>
			</div>


			<div class="sidebar-item">
				<a href="random.html" class="sidebar-link">
					<i class="fa-regular fa-file menu-icon"></i>
					<span class="menu-text">Random</span>
				</a>
			</div>
		</nav>

	</aside>

	<div class="sidebar-overlay"></div>

	<header class="topbar">

		<div class="topbar-left">
			<button type="button" class="menu-toggle" id="menuToggle">
				<i class="fa-solid fa-bars"></i>
			</button>
		</div>

		<div class="topbar-right">

			<button type="button" class="profile-btn" id="profileBtn">
				<i class="fa-solid fa-ellipsis"></i>
			</button>

			<div class="profile-dropdown" id="profileDropdown">
				<a href="profile.html">
					<i class="fa-solid fa-circle-user"></i>
					Profile
				</a>

				<a href="logout.html" class="logout">
					<i class="fa-solid fa-right-from-bracket"></i>
					Logout
				</a>
			</div>

		</div>
	</header>

	<main class="main-content">
		<div class="content">
			<div class="card">
				<div class="d-flex justify-content-between">
					<div class="d-flex gap-4">
						<a href="profile.html" class="h3">
							<i class="fa-solid fa-arrow-left"></i>
						</a>
						<h3 class="fw-bold">Links</h3>
					</div>
					<div>
						<button type="button" class="btn bg-primary icon" onclick="openAddSocialLink()">
							<i class="fa-solid fas fa-plus text-white"></i>
						</button>
					</div>
				</div>

				<hr>

				<article class="m-1 position-relative">

					<div class="icon-container" style="top: 0; right: 0;">
						<button type="button" class="btn btn-secondary icon" onclick="editSocialLink(15)">
							<i class="fa-solid fa-pencil"></i>
						</button>
					</div>

					<div class="d-flex align-items-center gap-3">


						<div>
							<p class="fw-bold mb-1">LinkedIn</p>

							<a href="https://linkedin.com/in/example" target="_blank" rel="noopener noreferrer">
								https://linkedin.com/in/example
							</a>
						</div>

					</div>

				</article>


			</div>
		</div>
		<div class="modal fade" id="socialLinkModal" data-bs-backdrop="static" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">

				<div class="modal-content">

					<div class="modal-header">

						<h5 class="modal-title">
							Add Link
						</h5>

						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>

					</div>

					<div class="modal-body">

						<div class="mb-3">

							<label for="socialMediaSelect" class="form-label">
								Platform
							</label>

							<select id="socialMediaSelect" class="form-select" required>
								<option value="" selected disabled>
									Select Platform
								</option>

								<option value="1">
									LinkedIn
								</option>

								<option value="2">
									GitHub
								</option>

								<option value="3">
									Facebook
								</option>

								<option value="4">
									Instagram
								</option>

								<option value="5">
									X / Twitter
								</option>

								<option value="6">
									YouTube
								</option>
							</select>

						</div>

						<div class="mb-3">

							<label for="socialLinkInput" class="form-label">
								Link
							</label>

							<input type="url" id="socialLinkInput" class="form-control"
								placeholder="https://linkedin.com/in/username" required>

						</div>

					</div>

					<div class="modal-footer justify-content-between">

						<button type="button" id="btnDeleteSocialLink"
							class="btn btn-link text-danger text-decoration-none d-none">
							Delete
						</button>

						<button type="button" id="btnSaveSocialLink" class="btn btn-primary">
							Save
						</button>

					</div>

				</div>

			</div>
		</div>
	</main>

	<script src="../libs/jquery-4.0.0.min.js"></script>
	<link rel="stylesheet" href="../libs/jquery-ui.css">
	<script src="../libs/jquery-ui.min.js"></script>
	<script src="../libs/bootstrap.min.js"></script>
	<script src="../libs/sweetalert2@11.js"></script>
	<script src="../js/layout.js"></script>

<script>
	/*
	|--------------------------------------------------------------------------
	| STATE
	|--------------------------------------------------------------------------
	*/

	let socialLinkMode = "add";
	let editingSocialLinkId = null;


	/*
	|--------------------------------------------------------------------------
	| ELEMENTS
	|--------------------------------------------------------------------------
	*/

	const socialLinkModalEl =
		document.getElementById(
			"socialLinkModal"
		);

	const socialLinkModal =
		bootstrap.Modal.getOrCreateInstance(
			socialLinkModalEl
		);

	const socialMediaSelect =
		document.getElementById(
			"socialMediaSelect"
		);

	const socialLinkInput =
		document.getElementById(
			"socialLinkInput"
		);

	const btnSaveSocialLink =
		document.getElementById(
			"btnSaveSocialLink"
		);

	const btnDeleteSocialLink =
		document.getElementById(
			"btnDeleteSocialLink"
		);


	/*
	|--------------------------------------------------------------------------
	| ADD
	|--------------------------------------------------------------------------
	*/

	function openAddSocialLink() {

		socialLinkMode =
			"add";

		editingSocialLinkId =
			null;


		document.querySelector(
			"#socialLinkModal .modal-title"
		).textContent =
			"Add Link";


		btnSaveSocialLink.textContent =
			"Save";


		btnDeleteSocialLink
			.classList
			.add("d-none");


		socialMediaSelect.value =
			"";

		socialLinkInput.value =
			"";


		socialLinkModal.show();
	}


	/*
	|--------------------------------------------------------------------------
	| EDIT
	|--------------------------------------------------------------------------
	*/

	function editSocialLink(id) {

		socialLinkMode =
			"edit";

		editingSocialLinkId =
			id;


		/*
		|--------------------------------------------------------------------------
		| DUMMY DATA
		| Nanti ganti dengan GET /social-media-links/{id}
		|--------------------------------------------------------------------------
		*/

		const data = {

			id:
				id,

			social_media_id:
				"1",

			link:
				"https://linkedin.com/in/example"

		};


		document.querySelector(
			"#socialLinkModal .modal-title"
		).textContent =
			"Edit Link";


		btnSaveSocialLink.textContent =
			"Update";


		btnDeleteSocialLink
			.classList
			.remove("d-none");


		socialMediaSelect.value =
			data.social_media_id;

		socialLinkInput.value =
			data.link;


		socialLinkModal.show();
	}


	/*
	|--------------------------------------------------------------------------
	| SAVE / UPDATE
	|--------------------------------------------------------------------------
	*/

	btnSaveSocialLink.addEventListener(
		"click",
		function () {

			const socialMediaId =
				socialMediaSelect.value;

			const link =
				socialLinkInput.value.trim();


			if (!socialMediaId) {

				alert(
					"Please select a platform."
				);

				return;
			}


			if (!link) {

				alert(
					"Please enter a link."
				);

				socialLinkInput.focus();

				return;
			}


			const data = {

				social_media_id:
					socialMediaId,

				link:
					link

			};


			let url;
			let type;


			/*
			|--------------------------------------------------------------------------
			| ADD
			|--------------------------------------------------------------------------
			*/

			if (
				socialLinkMode === "add"
			) {

				url =
					"/social-media-links";

				type =
					"POST";

			}

			/*
			|--------------------------------------------------------------------------
			| UPDATE
			|--------------------------------------------------------------------------
			*/

			else {

				url =
					`/social-media-links/${editingSocialLinkId}`;

				type =
					"PUT";

			}


			console.log(
				"MODE:",
				socialLinkMode
			);

			console.log(
				"URL:",
				url
			);

			console.log(
				data
			);


			$.ajax({

				url:
					url,

				type:
					type,

				data:
					data,

				success:
					function (response) {

						console.log(
							response
						);

						socialLinkModal.hide();

					},

				error:
					function (xhr) {

						console.log(
							xhr.responseJSON
						);

					}

			});

		}
	);


	/*
	|--------------------------------------------------------------------------
	| DELETE
	|--------------------------------------------------------------------------
	*/

	btnDeleteSocialLink.addEventListener(
		"click",
		function () {

			if (
				socialLinkMode !== "edit" ||
				!editingSocialLinkId
			) {
				return;
			}


			Swal.fire({

				title:
					"Delete link?",

				text:
					"This social media link will be removed.",

				icon:
					"warning",

				showCancelButton:
					true,

				confirmButtonText:
					"Delete",

				cancelButtonText:
					"Cancel"

			}).then(
				function (result) {

					if (!result.isConfirmed) {
						return;
					}


					$.ajax({

						url:
							`/social-media-links/${editingSocialLinkId}`,

						type:
							"DELETE",

						success:
							function (response) {

								console.log(
									response
								);

								socialLinkModal.hide();

							},

						error:
							function (xhr) {

								console.log(
									xhr.responseJSON
								);

							}

					});

				}
			);

		}
	);
</script>
</body>

</html>
